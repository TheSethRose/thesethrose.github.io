<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="profile">
<meta property="og:url" content="{{canonical}}">
<meta name="twitter:card" content="summary">
<script>
(() => {
  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark" || savedTheme === "light") {
    document.documentElement.dataset.theme = savedTheme;
  }
})();
</script>
<style>
:root{color-scheme:light;--bg:#fafafa;--fg:#111;--muted:#666;--quiet:#999;--rule:#ddd;--hover:#ececec;--focus:#111;--selection:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101010;--fg:#eee;--muted:#a8a8a8;--quiet:#777;--rule:#333;--hover:#242424;--focus:#eee;--selection:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101010;--fg:#eee;--muted:#a8a8a8;--quiet:#777;--rule:#333;--hover:#242424;--focus:#eee;--selection:rgba(255,255,255,.18)}
:root[data-theme="light"]{color-scheme:light;--bg:#fafafa;--fg:#111;--muted:#666;--quiet:#999;--rule:#ddd;--hover:#ececec;--focus:#111;--selection:rgba(0,0,0,.12)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;line-height:1.65;background:var(--bg);color:var(--fg);margin:0;padding:clamp(1.5rem,4vw,3.5rem);max-width:none}
::selection{background:var(--selection)}
.md-doc,footer{width:80%}
h1,h2,h3,h4,h5,h6,p,ul,ol,li{font-size:inherit;margin:0 0 1rem 0}
h1,h2,h3{font-weight:600}
h1{margin-top:0;margin-bottom:1.25rem}
h2{margin-top:2rem;margin-bottom:.5rem}
h3{margin-top:1.5rem;margin-bottom:.5rem}
h1::before{content:"# "}
h2::before{content:"## "}
h3::before{content:"### "}
a{color:inherit;text-decoration:none;border-radius:2px}
a::before{content:"["}
a::after{content:"](" attr(data-display-href) ")"}
a:hover,.theme-toggle:hover{background:var(--hover)}
a:hover::before{content:"**["}
a:hover::after{content:"](" attr(data-display-href) ")**"}
a:focus-visible,.theme-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
a[aria-current="page"]{font-weight:700}
a[aria-current="page"]::before{content:"**["}
a[aria-current="page"]::after{content:"](" attr(data-display-href) ")**"}
ul,ol{list-style:none;padding:0}
ul li,ol li{margin-bottom:.25rem}
li::before{content:"- "}
strong,em{font-weight:600;font-style:normal}
.md-nav{width:100%;margin:0 0 2.75rem 0;line-height:1.8}
.md-nav-line{margin:0}
.md-nav .sep{color:var(--quiet)}
.md-nav .sep::before,.md-nav .sep::after{content:""}
.theme-toggle{appearance:none;border:0;padding:0;margin:0;font:inherit;color:inherit;background:transparent;cursor:pointer;border-radius:2px}
.theme-toggle::before{content:"["}
.theme-toggle::after{content:"]"}
footer{margin-top:2rem;color:var(--muted)}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0 1rem}
.frontmatter{color:var(--muted);margin:0 0 2rem 0;white-space:pre-wrap}
@media (max-width:640px){
.md-doc,footer{width:auto}
.md-nav{margin-bottom:2rem}
.md-nav-line{display:grid;grid-template-columns:1fr;gap:.35rem;margin-bottom:.35rem}
.md-nav .sep{display:none}
.md-nav a::before{content:"- ["}
.md-nav a::after{content:"](" attr(data-display-href) ")"}
.md-nav a[aria-current="page"]::before{content:"- **["}
.md-nav a[aria-current="page"]::after{content:"](" attr(data-display-href) ")**"}
.md-nav .theme-toggle::before{content:"- ["}
.md-nav .theme-toggle::after{content:"]"}
}
</style>
<script type="application/ld+json">
{{jsonLd}}
</script>
